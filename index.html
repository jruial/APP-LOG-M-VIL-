<header class="top"><div class="wrap"><div class="eyebrow">LOGÍSTICA · HERRAMIENTA DE PLANIFICACIÓN</div><h1>Planificador de cargas</h1><p>Comprobación preliminar de cubicaje, estiba volumétrica en 3D, dimensiones y masa. Funciona localmente, sin conexión ni envío de datos.</p><nav class="topnav no-print" id="tabs" aria-label="Secciones"><button class="tab active" data-tab="plan"><span class="nav-full">Plan de carga</span><span class="nav-short">Plan</span></button><button class="tab" data-tab="vehicles">Vehículos</button><button class="tab" data-tab="materials">Materiales</button><button class="tab" data-tab="help"><span class="nav-full">Criterios y límites</span><span class="nav-short">Ayuda</span></button></nav></div></header>

<script>
(()=>{'use strict';
const STORAGE='planificador_cargas_local_v1';
const PALETTE=['#3a8d98','#c1803f','#7488b6','#868a53','#a474a7','#438c69','#b87775','#537f9d','#ac9859','#6d91a7'];
const $=(s)=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v);const dec=(v,k=1)=>Number(v||0).toLocaleString('es-ES',{minimumFractionDigits:k,maximumFractionDigits:k});
const int=v=>Math.round(Number(v||0)).toLocaleString('es-ES');
const uid=()=>('id'+Math.random().toString(36).slice(2,11));
const vol=(l,w,h)=>l*w*h/1e6;const area=(l,w)=>l*w/1e4;
function demo(){const v1='v-demo-1',v2='v-demo-2',m1='m-demo-1',m2='m-demo-2',m3='m-demo-3';return {vehicles:[{id:v1,name:'EJEMPLO · Caja de camión',l:420,w:210,h:210,payload:1200,doorW:200,doorH:190},{id:v2,name:'EJEMPLO · Furgón',l:300,w:170,h:175,payload:900,doorW:160,doorH:165}],materials:[{id:m1,name:'EJEMPLO · Caja mediana',l:80,w:60,h:60,kg:45,levels:2,rotate:true},{id:m2,name:'EJEMPLO · Baúl rígido',l:120,w:60,h:55,kg:55,levels:1,rotate:true},{id:m3,name:'EJEMPLO · Caja pequeña',l:40,w:30,h:30,kg:10,levels:3,rotate:true}],plan:[{id:m1,qty:5},{id:m2,qty:2},{id:m3,qty:8}],selectedVehicleId:v1,reservePct:15};}
function normalize(obj){if(!obj||!Array.isArray(obj.vehicles)||!Array.isArray(obj.materials)||!Array.isArray(obj.plan))throw Error('El archivo no contiene un plan válido.'); const val=(x)=>Number.isFinite(Number(x))?Number(x):0;const vehicles=obj.vehicles.map(v=>({id:String(v.id||uid()),name:String(v.name||'Vehículo'),l:val(v.l),w:val(v.w),h:val(v.h),payload:val(v.payload),doorW:val(v.doorW),doorH:val(v.doorH)})).filter(v=>v.l>0&&v.w>0&&v.h>0&&v.payload>0);const materials=obj.materials.map(m=>({id:String(m.id||uid()),name:String(m.name||'Material'),l:val(m.l),w:val(m.w),h:val(m.h),kg:val(m.kg),stackable:m.stackable!==false,mixedAbove:m.mixedAbove===true,maxTopKg:m.maxTopKg===null||m.maxTopKg===undefined||m.maxTopKg===''?null:(Number.isFinite(Number(m.maxTopKg))&&Number(m.maxTopKg)>=0?Number(m.maxTopKg):0),levels:Math.min(30,Math.max(1,Math.floor(val(m.levels)||1))),rotate:m.rotate!==false})).filter(m=>m.l>0&&m.w>0&&m.h>0&&m.kg>=0);const plan=obj.plan.filter(p=>materials.some(m=>m.id===p.id)).map(p=>({id:String(p.id),qty:Math.min(1000,Math.max(1,Math.floor(val(p.qty)||1)))}));return {vehicles,materials,plan,selectedVehicleId:vehicles.some(v=>v.id===obj.selectedVehicleId)?obj.selectedVehicleId:(vehicles[0]?.id||''),reservePct:Math.min(35,Math.max(0,val(obj.reservePct??15)))};}
let data;try{const saved=localStorage.getItem(STORAGE);data=saved?normalize(JSON.parse(saved)):demo();}catch(e){data=demo();}
let tab='plan',editV=null,editM=null,notification='';let lastCalc=null;const view3d={az:0.65,el:0.55,zoom:1.0,cut:null,vehicleId:null,focus:'',selected:null,hit:[],scene:null};function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch(e){notification='El navegador no permite guardar automáticamente. Usa «Exportar datos».';}}
function vehicle(){return data.vehicles.find(x=>x.id===data.selectedVehicleId)||null;}

obre cada soporte.</p><div class="callout" style="margin-top:12px">Un resultado positivo es una <b>propuesta preliminar de encaje</b>, no una validación de seguridad vial ni un plan de estiba certificado.</div></section></div><div class="right-stack"><section class="panel" id="seccion-resultado"><div class="panelhead"><h2>3. Resultado de viabilidad</h2><span class="pill">${v?esc(v.name):'Sin vehículo'}</span></div>${c.v&&c.details?summary(c):`<div class="status neutral">${esc(c.headline)}</div><p class="help" style="margin-top:8px">${esc(c.notes?.[0]||'')}</p>`}</section><section class="panel visual-panel" id="seccion-3d"><div class="panelhead"><div><h2>4. Distribución de carga · vista 3D interactiva</h2><p>La altura, el apilamiento y la posición horizontal de cada bulto se muestran a escala proporcional.</p></div><span class="pill no-print">3D sin conexión</span></div><div class="scene-controls no-print"><button class="active-view" data-action="3d-iso">Isométrica</button><button data-action="3d-front">Frontal</button><button data-action="3d-side">Lateral</button><button data-action="3d-top">Desde arriba</button><button data-action="3d-reset">Recentrar</button><button data-action="3d-in" title="Acercar el croquis">Zoom +</button><button data-action="3d-out" title="Alejar el croquis">Zoom −</button><button data-action="3d-png">Guardar croquis PNG</button></div><div class="v3-pills"><span>${v?`Caja: ${dimensions(v)}`:'Sin vehículo'}</span><span>Unidades ubicadas: ${int(c.loaded||0)} / ${int(c.pieces||0)}</span><span>${c.placed?.length||0} bultos individuales</span></div><div class="scene3d"><canvas id="load3d" role="img" aria-label="Modelo 3D interactivo de los bultos colocados en la caja del vehículo" tabindex="0"></canvas><div class="scene-help no-print">Girar: arrastra · Zoom: pellizca con 2 dedos · Pulsa un bulto</div><button type="button" class="scene-expand no-print" data-action="3d-expand" aria-label="Ampliar la vista 3D">⤢ Ampliar 3D</button></div><div id="threeInfo" class="scene-info no-print" aria-live="polite">Vista tridimensional de la propuesta; selecciona un bulto para ver su altura, medidas y peso.</div><div class="scene-bottom no-print"><div class="field"><label for="threeCut">Corte vertical: <b id="cutValue">${v?int(v.h):0} cm</b> (altura visualizada)</label><input id="threeCut" type="range" min="0" max="${v?Math.ceil(v.h):1}" step="5" value="${v?Math.ceil(v.h):1}"/><small>Reduce la altura visible para inspeccionar las capas inferiores; no modifica el cálculo.</small></div><div class="field"><label for="threeFocus">Destacar material</label><select id="threeFocus"><option value="">Todos los materiales</option>${c.details?.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')||''}</select><small>Los materiales restantes quedan atenuados, no retirados de la carga.</small></div></div><p class="help" style="margin-top:12px">Modelo de la <b>disposición propuesta</b>, no simulación física de la estiba. La búsqueda 3D permite varios bultos por superficie y mezcla autorizada. No comprueba estabilidad, amarres o reparto por ejes. La masa soportada se comprueba solo si se declara su límite.</p></section><section class="panel visual-panel"><div class="panelhead"><div><h2>5. Distribución propuesta · vista superior</h2><p>Proyección superior de los mismos bultos del 3D; Z indica la altura de su base. Los superiores ocultan parte de los inferiores.</p></div></div><div class="vizbox"><div class="plan-wrap">${planSvg(c)}</div><aside class="legend"><b>LEYENDA</b><div style="margin-top:8px">${c.details?.map(m=>`<div class="legendrow"><span class="swatch" style="background:${c.byColor[m.id]}"></span><span>${esc(m.name)}</span></div>`).join('')||'<span class="muted">No hay materiales.</span>'}<div class="legendrow" style="margin-top:14px"><span class="swatch" style="background:#e7ebed;border:1px dashed #9aafb9"></span><span>Reserva operativa</span></div></div>${c.v?`<hr style="border:0;border-top:1px solid var(--line)"><div>Suelo ocupado en propuesta: <b>${dec(c.placedArea,2)} m²</b></div><div class="bar"><i style="width:${Math.min(100,100*c.placedArea/c.floor)||0}%"></i></div><div>${dec(c.placedArea/c.floor*100,1)} % del suelo operativo</div><p class="help" style="margin-top:10px">La disposición se calcula automáticamente. La posición definitiva debe comprobarse en la carga real.</p>`:''}</aside></div></section><section class="panel" id="seccion-manifiesto"><h2>6. Manifiesto de carga</h2>${tableHtml(c)}</section></div></div><p class="footer">Versión local 2.3 · Almacenamiento exclusivo en este navegador. Para trasladar los datos a otro equipo, usa «Exportar datos» e «Importar datos». No se solicita ni se transmite información por Internet.</p>`}
function vehiclesPage(){const v=editV?data.vehicles.find(x=>x.id===editV):null;return `<div class="toolbar"><div><div class="kicker">CATÁLOGO DE VEHÍCULOS</div><h2>Vehículos y cajas de carga</h2></div><button data-action="export">Exportar datos</button></div><section class="panel formcard"><h2>${v?'Editar vehículo':'Registrar vehículo'}</h2><form id="vehicleForm" class="formgrid"><div class="field full"><label>Identificación / denominación</label><input name="name" maxlength="120" placeholder="Ej.: Camión carga 01" value="${esc(v?.name||'')}" required/></div>${[['l','Longitud interior (cm)'],['w','Anchura interior (cm)'],['h','Altura interior (cm)'],['payload','Carga útil autorizada (kg)'],['doorW','Anchura libre de puerta (cm) · opcional'],['doorH','Altura libre de puerta (cm) · opcional']].map(([key,label])=>`<div class="field"><label>${label}</label><input name="${key}" type="number" step="0.1" min="0" ${!['doorW','doorH'].includes(key)?'required':''} placeholder="${['doorW','doorH'].includes(key)?'Sin dato':'0'}" value="${v?esc(v[key]):''}"/></div>`).join('')}<div class="field full"><div class="inline"><button class="primary" type="submit">${v?'Guardar cambios':'Guardar vehículo'}</button>${v?'<button type="button" data-action="cancel-edit-v">Cancelar edición</button>':''}</div><p class="help">Mide el espacio interior útil, descontando pasos de rueda, mamparos, arcos y otros obstáculos. La forma de la caja se aproxima como un prisma rectangular.</p></div></form></section><section class="section-space"><h2>Vehículos guardados (${data.vehicles.length})</h2><div class="collection">${data.vehicles.map(x=>`<article class="item-card"><div class="name">${esc(x.name)}</div><p>Interior: <b>${dimensions(x)}</b><br>Volumen: ${dec(vol(x.l,x.w,x.h),2)} m³<br>Carga útil: ${int(x.payload)} kg${x.doorW&&x.doorH?`<br>Puerta: ${int(x.doorW)} × ${int(x.doorH)} cm`:''}</p><div class="actions"><button class="small" data-edit-v="${esc(x.id)}">Editar</button><button class="small" data-select-v="${esc(x.id)}">Usar en plan</button><button class="small danger" data-delete-v="${esc(x.id)}">Eliminar</button></div></article>`).join('')||'<div class="empty">No hay vehículos.</div>'}</div></section>`;}
function materialsPage(){const m=editM?data.materials.find(x=>x.id===editM):null;return `<div class="toolbar"><div><div class="kicker">CATÁLOGO DE MATERIALES</div><h2>Bultos y unidades de carga</h2></div><button data-action="export">Exportar datos</button></div><section class="panel formcard"><h2>${m?'Editar material':'Registrar material'}</h2><form id="materialForm" class="formgrid"><div class="field full"><label>Denominación del material embalado</label><input name="name" maxlength="120" placeholder="Ej.: Caja de repuestos en embalaje" value="${esc(m?.name||'')}" required/></div>${[['l','Longitud exterior (cm)'],['w','Anchura exterior (cm)'],['h','Altura exterior (cm)'],['kg','Masa de una unidad (kg)']].map(([key,label])=>`<div class="field"><label>${label}</label><input name="${key}" type="number" step="0.1" min="${key==='kg'?'0':'0.1'}" placeholder="0" value="${m?esc(m[key]):''}" required/></div>`).join('')}<div class="field"><label>Máximo de niveles (incluida la base)</label><input name="levels" type="number" step="1" min="1" max="30" value="${m?esc(m.levels):'1'}" required/><small>Máximo de niveles sobre este soporte, incluida su propia base. 1 = no recibe bultos. Un bulto de nivel máximo 1 sí puede ir encima de otro.</small></div><div class="field"><label>Orientación en la caja</label><label class="checkboxline"><input name="rotate" type="checkbox" ${!m||m.rotate?'checked':''}/> Permitir giro de 90° en planta</label><small>No se permite tumbar el bulto.</small></div><div class="field full"><label class="checkboxline"><input name="stackable" type="checkbox" ${!m||m.stackable!==false?'checked':''}/> Permitir recibir bultos encima (también requiere niveles &gt; 1)</label><label class="checkboxline"><input name="mixedAbove" type="checkbox" ${m?.mixedAbove?'checked':''}/> Permitir recibir materiales diferentes encima</label><small>En fichas antiguas la mezcla permanece desactivada. El permiso se aplica al contacto directo.</small></div><div class="field"><label>Masa máxima soportada encima (kg)</label><input name="maxTopKg" type="number" min="0" step="0.1" placeholder="Sin dato" value="${m?.maxTopKg??''}"/><small>Incluye todos los descendientes. 0 impide carga con masa positiva; vacío = resistencia no verificada.</small></div><div class="field full"><div class="inline"><button class="primary" type="submit">${m?'Guardar cambios':'Guardar material'}</button>${m?'<button type="button" data-action="cancel-edit-m">Cancelar edición</button>':''}</div><p class="help">Introduce las medidas EXTERIORES, incluyendo embalajes, asas y salientes. Si el material va sobre palé, mide el conjunto completo como una unidad.</p></div></form></section><section class="section-space"><h2>Materiales guardados (${data.materials.length})</h2><div class="collection">${data.materials.map(x=>`<article class="item-card"><div class="name">${esc(x.name)}</div><p>${dimensions(x)} · ${dec(x.kg,0)} kg/ud.<br>${dec(vol(x.l,x.w,x.h),3)} m³/ud. · ${x.levels===1?'No recibe bultos':'Máx. '+x.levels+' niveles'} · ${x.rotate?'Giro 90° admitido':'Orientación fija'}<br>${x.stackable===false?'No recibe bultos':x.mixedAbove?'Admite mezcla encima':'Solo mismo material encima'} · ${x.maxTopKg==null?'Resistencia no verificada':'Máx. encima: '+dec(x.maxTopKg,1)+' kg'}</p><div class="actions"><button class="small" data-edit-m="${esc(x.id)}">Editar</button><button class="small danger" data-delete-m="${esc(x.id)}">Eliminar</button></div></article>`).join('')||'<div class="empty">No hay materiales.</div>'}</div></section>`;}
function helpPage(){return `<div class="toolbar"><div><div class="kicker">GUÍA DE EMPLEO</div><h2>Criterios de cálculo y seguridad</h2></div></div><div class="help-columns"><section class="panel"><h3>1. No basta con comparar metros cúbicos</h3><p>Dos cargas con idéntico volumen pueden encajar de forma distinta por sus dimensiones y por el orden de colocación. Esta herramienta sitúa prismas individuales en X/Y/Z sobre el suelo o sobre una única base inferior. Cada superficie puede recibir varios bultos sin voladizos ni intersecciones. La mezcla debe autorizarse en el bulto de apoyo.</p><p><b>Volumen de un bulto:</b> longitud × anchura × altura. Con centímetros, divide el producto entre 1.000.000 para obtener m³.</p></section><section class="panel"><h3>2. Reserva de seguridad / ineficiencia</h3><p>Como criterio inicial no normativo, usa <b>10 %</b> en cajas homogéneas, <b>15 %</b> en mezcla habitual y <b>20–25 %</b> en formas dispares.</p><p>La reserva del plan se traduce en una <b>franja de longitud libre</b> al fondo; no se resta un segundo porcentaje a los bultos. Los huecos geométricos aparecen automáticamente en el plano.</p></section><section class="panel"><h3>3. Resultado «no se encontró acomodo»</h3><p>El programa utiliza una búsqueda heurística de hasta 12 estrategias de orden y colocación 3D, limitada a 500 bultos y un presupuesto de operaciones. Si no consigue ubicar todas las piezas, <b>no demuestra que sea imposible</b>. Puede exigir estiba manual, distinta orientación, reorganización o otro vehículo.</p><p>El plano tampoco determina si es físicamente posible introducir cada bulto por un pasillo de carga ocupado.</p></section><section class="panel"><h3>4. Restricciones que debes verificar</h3><p>Además de tamaño y masa total: reparto de peso por ejes, resistencia del piso, amarre, estabilidad, centro de gravedad, restricciones para apilar, salientes de la caja, puerta/rampa, medios de elevación y orden de descarga.</p><p><b>Un encaje positivo NO equivale a autorización de transporte o estiba segura.</b></p></section><section class="panel"><h3>5. Vista 3D y corte por altura</h3><p>El croquis 3D muestra cada bulto individual colocado donde lo situó el algoritmo, con su altura real y apilado vertical. Puedes girarlo, ampliar y hacer un corte de altura para ver las capas inferiores.</p><p><b>Importante:</b> el modelo 3D representa directamente las coordenadas X/Y/Z calculadas, sin reagrupar cajas en columnas. Un resultado de no encaje sigue siendo no concluyente.</p></section><section class="panel"><h3>6. Datos y uso sin red</h3><p>Los catálogos y el plan actual se guardan en el almacenamiento local del navegador. Si se borra la información del navegador podrían perderse. En móviles, abrir un archivo HTML desde un visor o desde otra ruta puede impedir el guardado o crear un almacenamiento separado.</p><p>Exporta periódicamente a <code>.json</code> para copia y traslado entre equipos; el <code>.csv</code> resume el manifiesto. No usa servidores, mapas ni librerías externas. La versión HTML funciona desde un archivo, pero no es una aplicación nativa ni se sincroniza sola entre móviles y ordenadores.</p></section><section class="panel"><h3>7. Cómo comenzar</h3><p>Registra las medidas reales del vehículo, mide cada bulto embalado, declara su masa y número máximo de niveles, selecciona el vehículo y añade cantidades. Ajusta la reserva y consulta el plano y las advertencias. Los registros marcados EJEMPLO son ficticios.</p></section></div>`;}

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function hexRGB(color){const h=String(color||'#6c8a9b').replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)||0);}
function tint(hex,mul,alpha=1){const c=hexRGB(hex);return `rgba(${c.map(v=>Math.round(clamp(v*mul,0,255))).join(',')},${alpha})`;}
function v3Message(text){const box=$('#threeInfo');if(box)box.textContent=text;}
function v3Cam(){const a=view3d.az,e=view3d.el;const right=[Math.cos(a),Math.sin(a),0];const up=[-Math.sin(e)*Math.sin(a),Math.sin(e)*Math.cos(a),Math.cos(e)];const toward=[Math.cos(e)*Math.sin(a),-Math.cos(e)*Math.cos(a),Math.sin(e)];return {right,up,toward};}
function v3Dot(p,q){return p[0]*q[0]+p[1]*q[1]+p[2]*q[2]}
function v3Points(x,y,z,w,l,h){return [[x,y,z],[x+w,y,z],[x+w,y+l,z],[x,y+l,z],[x,y,z+h],[x+w,y,z+h],[x+w,y+l,z+h],[x,y+l,z+h]];}
const FACESET=[{inds:[0,1,5,4],normal:[0,-1,0],light:.79},{inds:[2,3,7,6],normal:[0,1,0],light:.72},{inds:[3,0,4,7],normal:[-1,0,0],light:.66},{inds:[1,2,6,5],normal:[1,0,0],light:.91},{inds:[4,5,6,7],normal:[0,0,1],light:1.18}];
function v3Poly(ctx,pts,fill,stroke='#fff',line=1){if(!pts.length)return;ctx.beginPath();ctx.moveTo(pts[0].sx,pts[0].sy);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].sx,pts[i].sy);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function v3Line(ctx,a,b,color='#9baeba',weight=1,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.strokeStyle=color;ctx.lineWidth=weight;ctx.stroke();ctx.setLineDash([])}
function pointInside(poly,x,y){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.sy>y)!==(b.sy>y)&&x<(b.sx-a.sx)*(y-a.sy)/(b.sy-a.sy)+a.sx)inside=!inside}return inside;}
function make3DUnits(c){return {items:(c.placed||[]).map(p=>({...p,column:p.key,number:1,simplified:false})),simple:false};}
function draw3D(c){const cv=$('#load3d');if(!cv||!c?.v)return;const v=c.v,ctx=cv.getContext('2d');if(!ctx)return;const cssW=Math.max(100,cv.clientWidth),cssH=Math.max(100,cv.clientHeight);const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cssW,cssH);const cam=v3Cam();const center=[v.w/2,v.l/2,v.h/2];const raw=p=>[v3Dot(p.map((val,i)=>val-center[i]),cam.right),v3Dot(p.map((val,i)=>val-center[i]),cam.up),v3Dot(p.map((val,i)=>val-center[i]),cam.toward)];const corners=v3Points(0,0,0,v.w,v.l,v.h).map(raw);const minx=Math.min(...corners.map(p=>p[0])),maxx=Math.max(...corners.map(p=>p[0])),miny=Math.min(...corners.map(p=>p[1])),maxy=Math.max(...corners.map(p=>p[1]));const padding=cssW<550?25:48;const scale=Math.min((cssW-2*padding)/Math.max(1,maxx-minx),(cssH-2*padding)/Math.max(1,maxy-miny))*view3d.zoom;const cx=cssW/2-(minx+maxx)/2*scale,cy=cssH/2+(miny+maxy)/2*scale;const P=p=>{const r=raw(p);return {sx:cx+r[0]*scale,sy:cy-r[1]*scale,d:r[2]}};const frame=v3Points(0,0,0,v.w,v.l,v.h).map(P);
// Suelo, cuadrícula y franja reservada (de 0 a largo utilizable).
v3Poly(ctx,[frame[0],frame[1],frame[2],frame[3]],'#f1f6f8','#b5c8d4',1.3);
const step= v.w>700||v.l>1500?100:50;
for(let x=step;x<v.w;x+=step)v3Line(ctx,P([x,0,0]),P([x,v.l,0]),'#dbe5ec',.75);
for(let y=step;y<v.l;y+=step)v3Line(ctx,P([0,y,0]),P([v.w,y,0]),'#dbe5ec',.75);
if(c.usableL<v.l-.001){const a=c.usableL;v3Poly(ctx,[P([0,a,0]),P([v.w,a,0]),P([v.w,v.l,0]),P([0,v.l,0])],'rgba(141,164,184,.25)',null);v3Line(ctx,P([0,a,0]),P([v.w,a,0]),'#a1663a',2,[7,5]);}
// Jaula del vehículo (aristas superiores y verticales, al fondo de la carga).

const {items,simple}=make3DUnits(c);const faces=[];let drawn=0;const cut=clamp(view3d.cut??v.h,0,v.h);

function v3Selection(p){if(!p){view3d.selected=null;v3Message('Selecciona un bulto del croquis para ver medidas y posición.');draw3D(lastCalc);return;}view3d.selected=p;v3Message(`${p.name} · ${p.simplified?p.number+' unidades apiladas':'Nivel '+p.level} · Base ${int(p.w)} × ${int(p.l)} cm · Altura ${int(p.h)} cm · Masa ${dec(p.kg,1)} kg · Carga encima ${dec(p.topKg,1)} kg · Posición x=${int(p.x)} cm, fondo=${int(p.y)} cm, base a ${int(p.z)} cm.`);draw3D(lastCalc);}
function v3Hover(x,y){for(let i=view3d.hit.length-1;i>=0;i--){const hit=view3d.hit[i];if(pointInside(hit.polygon,x,y))return hit.item;}return null;}
function mount3D(c){const canvas=$('#load3d');if(!canvas)return;if(!c?.v){const box=canvas.parentElement;box.innerHTML='<div class="empty">Selecciona un vehículo para activar el croquis 3D.</div>';return;}if(view3d.vehicleId!==c.v.id){view3d.cut=c.v.h;view3d.vehicleId=c.v.id;view3d.selected=null;view3d.zoom=1;}view3d.cut=clamp(view3d.cut,0,c.v.h);const cutSlider=$('#threeCut'),cutLabel=$('#cutValue');if(cutSlider){cutSlider.max=c.v.h;cutSlider.value=view3d.cut;}if(cutLabel)cutLabel.textContent=int(view3d.cut)+' cm';const focus=$('#threeFocus');if(focus){if(!c.details?.some(m=>m.id===view3d.focus))view3d.focus='';focus.value=view3d.focus;}

const touches=new Map();let pinchDistance=0;

canvas.addEventListener('pointerdown',e=>{
 if(e.button!==0&&e.pointerType==='mouse')return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}

});
canvas.addEventListener('pointermove',e=>{
 if(!touches.has(e.pointerId))return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size>=2){const d=touchDistance();if(pinchDistance>0)view3d.zoom=clamp(view3d.zoom*(d/pinchDistance),.42,3.8);pinchDistance=d;draw3D(c);return;}
 if(!drag)return;
 const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};

});
canvas.addEventListener('pointerup',e=>{

});

canvas.addEventListener('wheel',e=>{e.preventDefault();view3d.zoom=clamp(view3d.zoom*(e.deltaY>0?.91:1.1),.42,3.8);draw3D(c)},{passive:false});
canvas.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','+','-'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')view3d.az-=.13;if(e.key==='ArrowRight')view3d.az+=.13;if(e.key==='ArrowUp')view3d.el=clamp(view3d.el+.13,.04,1.56);if(e.key==='ArrowDown')view3d.el=clamp(view3d.el-.13,.04,1.56);if(e.key==='+')view3d.zoom=clamp(view3d.zoom*1.12,.42,3.8);if(e.key==='-')view3d.zoom=clamp(view3d.zoom/1.12,.42,3.8);draw3D(c)}});

function v3Preset(which){const presets={"3d-iso":[.65,.55],"3d-front":[0,.12],"3d-side":[Math.PI/2,.12],"3d-top":[.65,1.56],"3d-reset":[.65,.55]};if(!presets[which])return;[view3d.az,view3d.el]=presets[which];if(which==='3d-reset'){view3d.zoom=1;view3d.cut=lastCalc?.v?.h??0;view3d.focus='';view3d.selected=null;const f=$('#threeFocus');if(f)f.value='';const s=$('#threeCut');if(s)s.value=view3d.cut;const l=$('#cutValue');if(l)l.textContent=int(view3d.cut)+' cm';v3Message('Vista restablecida; selecciona un bulto para ver sus dimensiones.')}document.querySelectorAll('.scene-controls [data-action]').forEach(el=>el.classList.toggle('active-view',el.dataset.action===which));draw3D(lastCalc);}

function render(){document.body.classList.remove('viewer-open');const tabs=[...document.querySelectorAll('#tabs [data-tab]')];tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#app').innerHTML=(notification?`<div class="callout no-print" style="margin-bottom:12px">${esc(notification)} <button class="small" data-action="dismiss">Cerrar</button></div>`:'')+({plan:planPage,vehicles:vehiclesPage,materials:materialsPage,help:helpPage}[tab]());if(tab==='plan')mount3D(lastCalc);}

document.addEventListener('change',e=>{if(e.target.id==='threeFocus'){view3d.focus=e.target.value;draw3D(lastCalc);return;}if(e.target.id==='selvehicle'){data.selectedVehicleId=e.target.value;save();render()}if(e.target.dataset.planQty){const id=e.target.dataset.planQty,qty=Number(e.target.value);if(!Number.isInteger(qty)||qty<0||qty>1000){alert('Introduce entre 0 y 1000 unidades.');render();return}if(qty===0){data.plan=data.plan.filter(p=>p.id!==id)}else{const p=data.plan.find(p=>p.id===id);if(p)p.qty=qty;}save();render()}});

save();render();});
